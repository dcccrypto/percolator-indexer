name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      # #172's sibling-checkout dance is gone: @percolatorct/sdk is a published
      # npm package now, not a `file:../percolator-sdk` link, so a bare checkout
      # installs it like any other dependency.
      - run: pnpm install --frozen-lockfile
      # One HIGH advisory is suppressed via pnpm.auditConfig.ignoreGhsas in
      # package.json (which cannot carry comments), so the reasoning lives here:
      #
      #   GHSA-3gc7-fjrx-p6mg — buffer overflow in bigint-buffer's toBigIntLE().
      #   Reached only as @percolatorct/sdk > @solana/spl-token >
      #   @solana/buffer-layout-utils > bigint-buffer. The advisory lists NO
      #   patched version ("<0.0.0"); bigint-buffer last published in 2022 and is
      #   unmaintained, so an override cannot fix it and nothing in our control
      #   drops the dependency.
      #
      # This is not a new exposure. The package has always shipped in the runtime
      # image; it only became VISIBLE to the audit when @percolatorct/sdk moved
      # from a `file:` link (whose transitive tree pnpm audit does not traverse)
      # to a registry dependency. Suppressing it explicitly keeps that fact
      # recorded rather than hidden behind a link.
      #
      # Revisit when @solana/spl-token drops @solana/buffer-layout-utils.
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    # #178 follow-up: this was gated to `refs/heads/main`, so the image was only
    # ever built AFTER merge — a Dockerfile or dependency change that broke the
    # build was invisible at review time and landed on main before anyone saw
    # it. Same hazard percolator-keeper#384 describes for its own docker job.
    # Running it on PRs is the only thing that makes a Dockerfile change
    # reviewable; the job is already self-contained (it checks the SDK into the
    # build context below).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # #175's in-context SDK checkout is gone for the same reason as #172's
      # sibling: the lockfile resolves @percolatorct/sdk from the registry now,
      # so the image installs it during its own pnpm install.
      - name: Build Docker image
        run: docker build -t percolator-indexer .

      # #178: "the image builds" does NOT prove the devDependencies were
      # actually dropped — the prune could silently no-op and this job would
      # stay green. Assert the outcome, not just the build.
      - name: Assert devDependencies are absent from the runtime image
        run: |
          set -euo pipefail
          for pkg in vitest vite tsx; do
            if docker run --rm --entrypoint sh percolator-indexer -c "test -e /app/node_modules/$pkg"; then
              echo "::error::devDependency '$pkg' is present in the runtime image (#178 regression)"
              exit 1
            fi
          done
          echo "OK: vitest, vite and tsx are absent from the runtime image"

      - name: Assert production dependencies survived the prune
        run: |
          set -euo pipefail
          # The mirror check: an over-aggressive prune that removed real
          # dependencies would also make the assertion above pass.
          for pkg in hono @supabase/supabase-js @solana/web3.js; do
            docker run --rm --entrypoint sh percolator-indexer -c "test -e /app/node_modules/$pkg" \
              || { echo "::error::production dependency '$pkg' missing from the runtime image"; exit 1; }
          done
          echo "OK: production dependencies are present"
